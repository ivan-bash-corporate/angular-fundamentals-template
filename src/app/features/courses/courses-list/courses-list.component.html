<div *ngIf="courses && courses.length > 0" class="courses-list">
    <app-course-card *ngFor="let course of courses"
                     [course]="course"
                     [isEditMode] ="editable"
                     (clickOnShow)="show(course.id)">
        <ng-container *ngIf="editable">
            <app-button [iconName]="'trash'" (click)="delete(course.id)"></app-button>
            <app-button [iconName]="'edit'" (click)="edit(course)"></app-button>
        </ng-container>
    </app-course-card>
</div>
